 let items=[['🔮',['Prizma','Prism'],30],['💠',['Safir','Sapphire'],45],['🌌',['Kozmik','Cosmic'],60],['✨',['Yıldız Tozu','Stardust'],85],['💎',['Aurora','Aurora'],110],['🪐',['Galaksi','Galaxy'],140]],owned=A.save.owned||[];content=`<h2>💎 ${txt('collectionTitle')}</h2><p class="muted">💎 ${A.save.coins} ${txt('crystals')} · ${locale()?'Unlock cosmetic collections with your in-game crystals.':'Kazandığın kristallerle kozmetik görünümler aç.'}</p><div class="collect-grid">${items.map((item,i)=>{let has=owned.includes(i);return `<div class="collect-item"><span class="collect-icon">${item[0]}</span><h4>${item[1][locale()]}</h4><p>${has?txt('owned'):'💎 '+item[2]}</p><button class="btn ${A.save.equipped===i?'secondary':'primary'} small" data-act="buy" data-id="${i}" ${A.save.equipped===i?'disabled':''}>${has?(A.save.equipped===i?txt('equipped'):txt('equip')):txt('buy')}</button></div>`}).join('')}</div>`;
}
modal.innerHTML=pop(content);}
function toast(message){let el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function flashMemory(i){let el=document.getElementById('memory-node-'+i);if(!el)return;el.classList.add('flash');clearTimeout(memoryFlashTimer);memoryFlashTimer=setTimeout(()=>el.classList.remove('flash'),410)}
function theme(){let palettes=[['#62e7f4','#897dff'],['#82e1f7','#4a83f3'],['#c198ff','#6a80f4'],['#f7ce91','#fd82aa'],['#45ddb9','#a7a2ff'],['#ff89d7','#b7a1ff']],idx=A.save.equipped;if(idx!==null&&palettes[idx]){document.documentElement.style.setProperty('--cyan',palettes[idx][0]);document.documentElement.style.setProperty('--purple',palettes[idx][1])}}
function dispatch(e){let b=e.target.closest('[data-act]');if(!b)return;let act=b.dataset.act,id=b.dataset.id;if(act==='modalBackdrop'&&e.target!==b)return;if(act==='modalBackdrop'||act==='close')return close();
 switch(act){case 'home':close();A.go('home');break;case 'worlds':close();A.go('worlds');break;case 'modes':close();A.go('modes');break;
 case 'levels':open('levels',id);break;case 'startLevel':{let w=Number(b.dataset.world),n=Number(id);if(n>A.nextLevel(w)&&!A.save.completed[w+'-'+n])return toast(txt('notYet'));close();A.start(w,n,'story');break}
 case 'chooseMode':{let mode=id;if(mode==='story'){close();A.go('worlds')}else if(mode==='daily'){close();A.dailyStart()}else open('worldPicker',mode);break}
 case 'startMode':{let m=b.dataset.mode;close();A.startMode(m,Number(id));break}
 case 'daily':close();A.dailyStart();break;case 'resume':close();A.resume();break;
 case 'profile':open('profile');break;case 'achievements':open('achievements');break;case 'collection':open('collection');break;case 'settings':open('settings');break;
 case 'move':{let v=A.p?.type==='cube'?id:Number(id);A.move(v);break}case 'memoryPlay':A.memoryPlay();break;case 'undo':A.undoMove();break;case 'reset':A.reset();break;case 'hint':A.hintMove();break;
 case 'photo':A.photo=!A.photo;A.render?.();break;case 'quit':A.persist();A.go('home');break;
 case 'retry':A.reset();A.won=false;A.go('game');break;case 'repeat':A.start(A.world,A.level,A.mode,A.offset);break;case 'next':A.next();break;
 case 'buy':{let costs=[30,45,60,85,110,140],n=Number(id);if(!A.save.owned.includes(n)){if(A.save.coins<costs[n])return toast(locale()?'Not enough crystals':'Yeterli kristalin yok');A.save.coins-=costs[n];A.save.owned.push(n)}A.save.equipped=n;A.persist();theme();A.render?.();break}
 case 'export':A.backup();toast(txt('export'));break;case 'import':document.getElementById('importFile')?.click();break;
 }}
document.addEventListener('click',dispatch);
document.addEventListener('change',async e=>{let el=e.target;if(el.id==='locale'){A.changeLocale(el.value);return}if(el.dataset.setting){A.updateSettings(el.dataset.setting,el.type==='checkbox'?el.checked:el.value);return}if(el.id==='importFile'&&el.files?.[0]){try{let data=await el.files[0].text();A.restore(data);close();toast(locale()?'Save restored':'Kayıt yüklendi')}catch(err){toast(locale()?'Save file invalid':'Kayıt dosyası geçersiz')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(dialog)close();else if(A.screen==='game'){A.persist();A.go('home')}return}if(A.screen!=='game'||dialog)return;if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();A.undoMove();return}const dirs={ArrowUp:3,ArrowRight:0,ArrowDown:1,ArrowLeft:2};if(e.key in dirs&&['cube','physics'].includes(A.p?.type)){e.preventDefault();A.move(A.p.type==='cube'?{ArrowUp:'up',ArrowRight:'right',ArrowDown:'down',ArrowLeft:'left'}[e.key]:dirs[e.key])}});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#board-panel'))down={x:e.clientX,y:e.clientY,t:Date.now()}},{passive:true});document.addEventListener('pointerup',e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(A.screen!=='game'||!['physics','cube'].includes(A.p?.type)||Math.max(Math.abs(dx),Math.abs(dy))<35)return;let d=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');let val=A.p.type==='cube'?d:{right:0,down:1,left:2,up:3}[d];A.move(val)},{passive:true});
setInterval(()=>{if(A.screen==='game'&&!A.won){let c=document.getElementById('clock');if(c)c.textContent=time(A.mode==='timed'?A.remaining():A.elapse());if(A.mode==='timed'&&A.remaining()<=0)A.fail('outOfTime')}},250);
// A lightweight original animated starfield; never loads any outside assets.
const canvas=document.getElementById('cosmos');let cx=canvas.getContext('2d'),stars=[],frame=0,last=0;
function resize(){let dpr=Math.min(2,window.devicePixelRatio||1),w=window.innerWidth,h=window.innerHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);cx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(({low:0,medium:42,high:95,ultra:150}[A.graphicsLevel]||95),Math.floor(w*h/6000))},(_,i)=>({x:Math.random()*w,y:Math.random()*h,r:.4+Math.random()*1.4,phase:Math.random()*8}));}
window.addEventListener('resize',resize);resize();function animate(t){requestAnimationFrame(animate);if(A.save.settings.reduceMotion||A.graphicsLevel==='low')return;if(t-last<30)return;last=t;cx.clearRect(0,0,window.innerWidth,window.innerHeight);for(let s of stars){let a=.13+.30*(1+Math.sin(t*.0008+s.phase))/2;cx.beginPath();cx.fillStyle=`rgba(191,218,255,${a})`;cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fill();}frame++}requestAnimationFrame(animate);
window.addEventListener('popstate',()=>{if(dialog){close();return}if(A.screen==='game'){A.persist();A.go('home')}else if(A.screen!=='home')A.go('home')});A.render=render;A.toast=toast;root.NUI={render,toast,flashMemory,open,close};A.applyGraphics();theme();A.playMusicToggle();resize();render();
})(window);
