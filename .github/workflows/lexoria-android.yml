name: Build LEXORIA Android APK
on:
  push:
    branches:
      - lexoria-android
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout LEXORIA branch
        uses: actions/checkout@v4
      - name: Extract game source and optimized media
        run: |
          mkdir -p LEXORIA
          base64 --decode LEXORIA/source_payload.b64 | tar -xJ -C LEXORIA
          base64 --decode LEXORIA/assets_payload.b64 | tar -xJ -C LEXORIA
          python3 - <<'PY'
          import json
          with open("LEXORIA/app/src/main/assets/levels.json",encoding="utf-8") as f:
              data=json.load(f)
          print("Level count:",len(data["levels"]))
          print("Dictionary entries:",len(data["dictionary"]))
          assert len(data["levels"]) >= 200
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 36
        run: |
          echo "y" | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile installable debug APK
        working-directory: LEXORIA
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload LEXORIA APK
        uses: actions/upload-artifact@v4
        with:
          name: LEXORIA-Android-APK
          path: LEXORIA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
